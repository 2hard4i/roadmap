<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Portal</title>

<style>

/* Page background */
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Segoe UI, sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b,#020617);
color:white;
}

/* Login Card */
.login-box{
width:320px;
padding:40px;
border-radius:15px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
box-shadow:0 10px 40px rgba(0,0,0,0.6);
text-align:center;
}

/* Title */
.login-box h2{
margin-bottom:20px;
font-weight:500;
}

/* Input */
input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin-top:10px;
background:#0f172a;
color:white;
font-size:15px;
outline:none;
}

/* Button */
button{
margin-top:20px;
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#38bdf8;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#0ea5e9;
transform:scale(1.03);
}

/* Error message */
#error{
margin-top:10px;
color:#f87171;
font-size:14px;
}

</style>
</head>

<body>

<div class="login-box">

<h2>Website Access</h2>

<input type="password" id="code" placeholder="Enter Access Code">

<button onclick="login()">Enter Portal</button>

<p id="error"></p>

</div>

<script>

const correctCode = "senjosh1113";

function login(){

let userCode = document.getElementById("code").value;

if(userCode === correctCode){

sessionStorage.setItem("loggedIn","true");
window.location.href="home.html";

}else{

document.getElementById("error").innerText="Incorrect access code";

}

}

/* Allow Enter key */
document.getElementById("code").addEventListener("keypress",function(e){

if(e.key === "Enter"){
login();
}

});

</script>

</body>
</html>
